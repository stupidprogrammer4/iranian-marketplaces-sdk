[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iranian-marketplaces-sdk"
version = "0.2.0"
description = "A unified SDK for the major Iranian marketplaces, with both sync and async engines."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "stupidprogrammer4", email = "captainjoker757@gmail.com" }]
keywords = [
    "marketplace",
    "digikala",
    "snapp",
    "basalam",
    "tapsi",
    "sdk",
    "async",
    "sync",
    "httpx",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    # httpx drives both engines: it is the one client whose sync and async APIs behave the same,
    # so neither engine needs a transport the other does not have.
    "httpx>=0.27",
    # pydantic v2 parses and validates every response. These payloads nest six levels deep in
    # places, so hand-written constructors would be the largest and least reliable part of the SDK.
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/stupidprogrammer4/iranian-marketplaces-sdk"
Repository = "https://github.com/stupidprogrammer4/iranian-marketplaces-sdk"
Issues = "https://github.com/stupidprogrammer4/iranian-marketplaces-sdk/issues"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pyright>=1.1.380",
    "ruff>=0.6",
    { include-group = "test" },
]
test = [
    "anyio>=4.4",
    "coverage[toml]>=7.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["iranian_marketplaces_sdk"]

[tool.hatch.build.targets.sdist]
include = [
    "/iranian_marketplaces_sdk",
    "/tests",
    "/main.py",
    "/README.md",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ASYNC",# flake8-async — a blocking call in a coroutine stalls every other request
    "S",    # flake8-bandit
    "BLE",  # flake8-blind-except
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "S101",  # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
# Each data package re-exports its submodules to present one flat namespace, which is a star
# import by construction.
"iranian_marketplaces_sdk/**/data/__init__.py" = ["F403", "F405"]
"tests/*" = ["S", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["iranian_marketplaces_sdk"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
files = ["iranian_marketplaces_sdk", "tests", "main.py"]
strict = true
warn_unreachable = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
plugins = ["pydantic.mypy"]

# The flat re-export in each data/__init__.py is a star import, so mypy cannot attribute a name to
# the submodule it came from. The submodules themselves are checked strictly.
[[tool.mypy.overrides]]
module = "iranian_marketplaces_sdk.marketplaces.*.data"
implicit_reexport = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
markers = [
    "sync: tests targeting the sync engine",
    "async: tests targeting the async engine",
]

[tool.coverage.run]
source = ["iranian_marketplaces_sdk"]
branch = true
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.pyright]
include = ["iranian_marketplaces_sdk", "tests", "main.py"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
